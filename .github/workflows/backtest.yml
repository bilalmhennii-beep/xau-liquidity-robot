name: xau-sample-backtest
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download public XAUUSD M1 evaluation sample
        run: |
          mkdir -p data results
          curl -L --fail --retry 3 -o data/XAUUSD_1m.csv https://raw.githubusercontent.com/getdata-finance/xauusd-1m-ohlcv-metals-historical-data/main/XAUUSD_1m.csv
      - name: Validate data
        run: |
          python - <<'PY'
          from src.data import load_ohlc
          from src.validate import validate
          d=load_ohlc("data/XAUUSD_1m.csv")
          print(validate(d))
          PY
      - name: Run baseline
        run: python -m src.backtest data/XAUUSD_1m.csv | tee results/summary.txt
      - name: Run MICRO 1:1 scalp test
        shell: bash
        run: |
          set -o pipefail
          python -m src.micro_backtest data/XAUUSD_1m.csv | tee results/micro-summary.txt
      - name: Run HYBRID confirmed scalp test
        shell: bash
        run: |
          set -o pipefail
          python -m src.hybrid_micro data/XAUUSD_1m.csv | tee results/hybrid-summary.txt
      - name: Run HTF liquidity FVG V3
        shell: bash
        run: |
          set -o pipefail
          python -m src.htf_liquidity_fvg_v3 data/XAUUSD_1m.csv | tee results/htf-liquidity-fvg-v3-summary.txt
      - name: Run ICT SMC V2
        shell: bash
        run: |
          set -o pipefail
          python -m src.ict_smc_v2 data/XAUUSD_1m.csv | tee results/ict-smc-v2-summary.txt
      - name: Run selective sweep
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.run_sweep data/XAUUSD_1m.csv | tee results/sweep-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xau-baseline-results
          path: results/
